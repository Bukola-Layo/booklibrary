*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:'DM Sans',sans-serif}.stage{width:min(100%,1440px);aspect-ratio:4/3;min-height:680px;margin:auto;position:relative;overflow:hidden;background:#fff}.nav{position:absolute;top:4.4%;left:4.3%;right:4.3%;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.03em}.nav .brand{font-family:'Playfair Display',serif;font-size:18px}.nav .center{position:absolute;left:50%;transform:translateX(-50%)}.nav a{color:inherit;text-decoration:none}.hero{position:absolute;top:19%;left:0;right:0;text-align:center;font:500 clamp(38px,4.4vw,65px)/.94 'Playfair Display',serif;letter-spacing:-.04em}.mini-index{position:absolute;top:10%;left:50%;width:34%;display:flex;justify-content:space-between;color:#888;font-size:9px}.mini-index span:nth-child(2){transform:translateY(38px)}.mini-index span:nth-child(3){transform:translateY(-17px)}.mini-index span:nth-child(4){transform:translateY(34px)}.mini-index span:nth-child(5){transform:translateY(-6px)}.shelf{position:absolute;left:4.3%;right:4.3%;bottom:10.5%;height:43%;display:flex;align-items:flex-end;justify-content:center;gap:clamp(3px,.5vw,8px);perspective:1200px}.book{height:var(--h);width:var(--w);flex:0 1 var(--w);position:relative;transform:rotate(var(--tilt,0deg));transform-origin:bottom center;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s;cursor:pointer;z-index:1}.book:hover{transform:translateY(-18px) rotate(0deg) scale(1.07);z-index:5;filter:drop-shadow(0 9px 8px #0002)}.book .spine{height:100%;width:100%;position:absolute;inset:0;background:var(--color);border:1px solid #0001;box-shadow:inset 2px 0 5px #fff4,inset -2px 0 5px #0001;overflow:hidden;display:flex;align-items:center;justify-content:center}.spine:after{content:'';position:absolute;left:3px;right:3px;top:4px;bottom:4px;border-left:1px solid #ffffff40;border-right:1px solid #00000012}.spine-title{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;color:var(--ink);font:500 clamp(8px,.72vw,11px) 'Playfair Display',serif;letter-spacing:.035em;max-height:90%;overflow:hidden;z-index:1}.front{position:absolute;inset:0;opacity:0;transform:rotateY(90deg);transition:opacity .25s;pointer-events:none;background:#eee;box-shadow:0 5px 10px #0002}.front img{width:100%;height:100%;object-fit:cover}.book:hover .front{opacity:1}.book:hover .spine{filter:brightness(.85)}.featured{width:18%;flex-basis:18%;height:86%;z-index:2;transform:translateY(0)}.featured:hover{transform:translateY(-20px) scale(1.04)}.featured .front{opacity:1;transform:none;position:absolute;inset:0;pointer-events:auto}.featured .spine{display:none}.shelf-base{position:absolute;bottom:9.5%;left:4.3%;right:4.3%;height:8px;background:#f1f1f1;border-top:1px solid #e4e4e4}.foot{position:absolute;bottom:4.5%;left:4.3%;right:4.3%;display:flex;justify-content:space-between;color:#777;font:9px 'Playfair Display',serif}.loading{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);font-size:10px;color:#aaa;opacity:0;transition:opacity .3s}.loading.show{opacity:1}.book-modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.book-modal.open{display:flex}.modal-card{background:#fff;width:min(780px,95vw);padding:30px;display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:28px;position:relative;box-shadow:0 20px 70px #0003}.modal-card img{width:100%;height:360px;object-fit:contain}.modal-title{font:32px 'Playfair Display',serif;margin:10px 0}.modal-author{color:#777;font-size:13px}.modal-desc{font-size:14px;line-height:1.65;margin:20px 0}.get-book{display:inline-block;background:#171717;color:white;text-decoration:none;padding:13px 19px;font-size:12px;letter-spacing:.03em}.close{position:absolute;top:12px;right:14px;border:0;background:none;font-size:24px;cursor:pointer}.hint{font-size:10px;color:#999;margin-top:14px}@media(max-width:760px){.stage{min-height:540px}.hero{top:23%;font-size:clamp(34px,8vw,48px)}.shelf{height:34%;bottom:13%;gap:2px}.book{width:6%;flex-basis:6%}.featured{width:19%;flex-basis:19%}.spine-title{font-size:7px}.mini-index{width:46%;font-size:7px}.modal-card{grid-template-columns:130px 1fr;padding:20px;gap:16px}.modal-card img{height:240px}.modal-title{font-size:22px}.modal-desc{font-size:12px;max-height:160px;overflow:auto}}@media(max-width:480px){.stage{min-height:520px}.nav{font-size:9px}.nav .brand{font-size:15px}.shelf{height:30%;bottom:16%}.book:nth-child(3),.book:nth-child(6),.book:nth-child(10),.book:nth-child(13){display:none}.featured{flex-basis:24%;width:24%}.mini-index{top:13%}.modal-card{grid-template-columns:1fr}.modal-card img{height:200px;width:auto;margin:auto}.modal-title{font-size:24px}}
</style></head><body><main class="stage"><nav class="nav"><a class="brand" href="#">IZA</a><span class="center">PART I</span><a href="#about">ABOUT</a></nav><div class="mini-index" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><h1 class="hero">THE PERSONAL<br>CURATION</h1><section class="shelf" id="shelf" aria-label="Book shelf"></section><div class="shelf-base"></div><footer class="foot"><span>5</span><span>VII</span><span>IX</span></footer><div class="loading" id="loading">Loading cover images from Google Books…</div></main><div class="book-modal" id="modal"><div class="modal-card"><button class="close" aria-label="Close">×</button><img id="modal-cover" alt="Book cover"><div><div class="modal-author" id="modal-author"></div><h2 class="modal-title" id="modal-title"></h2><p class="modal-desc" id="modal-desc"></p><a class="get-book" id="get-book" target="_blank" rel="noopener">GET THIS BOOK ↗</a><div class="hint">Opens book details and reading options.</div></div></div></div>
<script>
const books=[
 {q:'The Psychology of Money Morgan Housel',title:'The Psychology of Money',author:'Morgan Housel',color:'#b9d3d1',ink:'#142e28',h:68,w:5.2},
 {q:'Deep Work Cal Newport',title:'Deep Work',author:'Cal Newport',color:'#c9c2b5',ink:'#29251f',h:55,w:5.1},
 {q:'Essentialism Greg McKeown',title:'Essentialism',author:'Greg McKeown',color:'#e9a6c2',ink:'#54233c',h:77,w:5.1},
 {q:'The Creative Act Rick Rubin',title:'The Creative Act',author:'Rick Rubin',color:'#ee6b35',ink:'#2b1710',h:72,w:4.8},
 {q:'Steal Like an Artist Austin Kleon',title:'Steal Like an Artist',author:'Austin Kleon',color:'#252525',ink:'#fff',h:67,w:5.1},
 {q:'The Almanack of Naval Ravikant Eric Jorgenson',title:'The Almanack of Naval Ravikant',author:'Eric Jorgenson',color:'#d5b6a6',ink:'#32231b',h:83,w:5.8,tilt:-5},
 {q:'Atomic Habits James Clear',title:'Atomic Habits',author:'James Clear',color:'#efe4cc',ink:'#3d2e1a',h:77,w:5.4},
 {q:'featured The Design of Everyday Things Don Norman',title:'The Design of Everyday Things',author:'Don Norman',color:'#214766',ink:'#fff',h:86,w:18,featured:true},
 {q:'Thinking Fast and Slow Daniel Kahneman',title:'Thinking, Fast and Slow',author:'Daniel Kahneman',color:'#edc8a8',ink:'#3c271a',h:80,w:5.2,tilt:4},
 {q:'The Creative Confidence Tom Kelley',title:'Creative Confidence',author:'Tom Kelley',color:'#285f91',ink:'#fff',h:69,w:5.2},
 {q:'Show Your Work Austin Kleon',title:'Show Your Work!',author:'Austin Kleon',color:'#d9d9d4',ink:'#1d1d1d',h:84,w:5.8},
 {q:'Ways of Seeing John Berger',title:'Ways of Seeing',author:'John Berger',color:'#353d5b',ink:'#fff',h:58,w:5.1,tilt:-4},
 {q:'The Art of Possibility Rosamund Stone Zander',title:'The Art of Possibility',author:'Rosamund Stone Zander',color:'#d4ad44',ink:'#3d2b0c',h:74,w:5.2},
 {q:'Quiet Susan Cain',title:'Quiet',author:'Susan Cain',color:'#5a2818',ink:'#fff',h:62,w:5.8},
 {q:'The Four Agreements Don Miguel Ruiz',title:'The Four Agreements',author:'Don Miguel Ruiz',color:'#f0b88a',ink:'#402411',h:73,w:5.2}
];
const shelf=document.getElementById('shelf'),modal=document.getElementById('modal');
function createBook(book,index){const el=document.createElement('article');el.className='book'+(book.featured?' featured':'');el.style.cssText=`--h:${book.h}%;--w:${book.w}%;--color:${book.color};--ink:${book.ink};--tilt:${book.tilt||0}deg`;el.setAttribute('tabindex','0');el.setAttribute('aria-label',book.title+' by '+book.author);el.innerHTML=`<div class="spine"><span class="spine-title">${book.title}</span></div><div class="front"><img loading="lazy" alt="${book.title} cover"></div>`;
 const img=el.querySelector('img');fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(book.q)+'&maxResults=1').then(r=>r.json()).then(data=>{const item=data.items?.[0];if(item){const volume=item.volumeInfo;const cover=volume.imageLinks?.thumbnail||volume.imageLinks?.smallThumbnail;if(cover){img.src=cover.replace('http:','https:');book.cover=img.src;book.desc=volume.description||'A curated book worth exploring. Open the book details to learn more.';book.link=volume.infoLink||('https://books.google.com/books?q='+encodeURIComponent(book.title));book.realTitle=volume.title||book.title;book.realAuthor=(volume.authors||[book.author]).join(', ');}}}).catch(()=>{});
 el.addEventListener('click',()=>openBook(book,img));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook(book,img)}});return el;}
function openBook(book,img){document.getElementById('modal-cover').src=book.cover||img.src;document.getElementById('modal-title').textContent=book.realTitle||book.title;document.getElementById('modal-author').textContent=book.realAuthor||book.author;document.getElementById('modal-desc').textContent=book.desc||'Explore this title and discover more about the book.';document.getElementById('get-book').href=book.link||('https://books.google.com/books?q='+encodeURIComponent(book.title));modal.classList.add('open');}
books.forEach((b,i)=>shelf.appendChild(createBook(b,i)));document.getElementById('loading').classList.add('show');setTimeout(()=>document.getElementById('loading').classList.remove('show'),1800);
modal.querySelector('.close').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script></body></html>
